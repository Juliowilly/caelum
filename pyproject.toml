[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "caelum"
dynamic = ["version"]
description = "Live sky overlay for the Linux desktop: sun, moon, planets, stars and weather for your location"
readme = "README.md"
# Table form: Ubuntu 24.04 (PPA target) ships setuptools 68, which predates the PEP 639 string form
license = { text = "MIT" }
authors = [{ name = "Juliowilly" }]
requires-python = ">=3.8"
# PyGObject and pycairo build from source on PyPI; install the distro packages
# (python3-gi, python3-gi-cairo, gir1.2-gtk-3.0) and use a venv with system site packages.
dependencies = ["PyGObject", "pycairo"]
classifiers = [
    "Environment :: X11 Applications :: GTK",
    "Operating System :: POSIX :: Linux",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Astronomy",
]

[project.optional-dependencies]
compass = ["pyserial", "dbus-python"]

[project.urls]
Homepage = "https://github.com/Juliowilly/caelum"

[project.gui-scripts]
caelum = "caelum.gtk_ui.app:main"

[tool.setuptools.dynamic]
version = { attr = "caelum.__version__" }

[tool.setuptools.packages.find]
include = ["caelum*"]
exclude = ["caelum.kivy_ui*"]

# Landscape photos (built by packaging/make-landscapes.py)
[tool.setuptools.package-data]
caelum = ["data/landscapes/*.jpg", "data/landscapes/*.png", "data/landscapes/*.json"]
