# Windows test build: GTK3 + PyGObject from MSYS2, bundled by PyInstaller into a zip.
# Each run checks the bundle (--selftest), then starts Caelum behind and in front of the desktop
# icons and clicks its controls (packaging/windows/ci-check.ps1); screenshots are kept.
name: Windows build

on:
  workflow_dispatch:
  push:
    branches: [master, windows]
    paths:
      - 'caelum/**'
      - 'data/**'
      - 'tests/**'
      - 'packaging/windows/**'
      - '.github/workflows/windows.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: zip
          pacboy: >-
            gtk3:p python-gobject:p python-cairo:p python-pyserial:p
            pyinstaller:p pyinstaller-hooks-contrib:p python-pillow:p ca-certificates:p

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Build
        run: packaging/windows/build.sh

      - name: Self-test the bundle
        run: |
          dist/caelum/caelum.exe --selftest selftest.txt || status=$?
          cat selftest.txt
          exit ${status:-0}

      # Behind the icons (the default) and in front of them: screenshots and real clicks
      - name: Start Caelum and click its controls
        shell: pwsh
        run: packaging/windows/ci-check.ps1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: caelum-windows-x64
          path: dist/caelum-*-windows-x64.zip

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checks
          path: |
            selftest.txt
            checks/
